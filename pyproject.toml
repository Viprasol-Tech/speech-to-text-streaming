[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-to-text-streaming"
version = "0.1.0"
description = "Realtime speech-to-text streaming server (FastAPI WebSocket) with an offline fake recognizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["speech-to-text", "stt", "streaming", "websocket", "fastapi", "asr", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
vosk = ["vosk>=0.3.45"]
dev = [
    "httpx>=0.27",
    "websockets>=12.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/speech-to-text-streaming"
Issues = "https://github.com/Viprasol-Tech/speech-to-text-streaming/issues"

[project.scripts]
stt-server = "speech_to_text_streaming.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_to_text_streaming"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
